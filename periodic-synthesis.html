<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Periodic Synthesis</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{min-height:100vh;background:#020810;color:#c8dff0;font-family:'Share Tech Mono',monospace;overflow-x:hidden;}
::-webkit-scrollbar{width:5px;height:5px;background:#020810;}
::-webkit-scrollbar-thumb{background:#0d2240;border-radius:4px;}
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:9000;
  background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,.025) 3px,rgba(0,0,0,.025) 4px);}

/* ─ HEADER ─ */
#hdr{background:#030c1c;border-bottom:1px solid #0d2240;position:sticky;top:0;z-index:100;}
#hdr-in{max-width:1600px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
#logo{font-family:'Orbitron',sans-serif;font-weight:900;font-size:clamp(13px,1.8vw,22px);letter-spacing:.22em;color:#00e5ff;animation:glow 3.5s ease-in-out infinite;}
#logo-sub{font-size:8px;letter-spacing:.28em;color:#0d2240;margin-top:3px;}
#modebar{display:flex;gap:3px;background:#040d1c;border:1px solid #0d2240;border-radius:10px;padding:3px;}
.mbtn{padding:7px 16px;background:none;border:1px solid transparent;border-radius:7px;color:#1a3a5a;font-size:9px;font-family:'Orbitron',sans-serif;letter-spacing:.12em;cursor:pointer;transition:all .2s;}
.mbtn.on{background:linear-gradient(135deg,#0a2040,#071428);border-color:rgba(0,229,255,.27);color:#00e5ff;box-shadow:0 0 14px rgba(0,229,255,.1);}
#srch{background:#040d1c;border:1px solid #0d2240;border-radius:8px;padding:7px 14px;color:#4a8aaa;font-size:10px;width:200px;outline:none;font-family:'Share Tech Mono',monospace;}

/* ─ MAIN ─ */
#main{max-width:1600px;margin:0 auto;padding:14px 16px 50px;}
#legend{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:14px;}
.cpill{display:flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:8.5px;cursor:pointer;border:1px solid #0d2240;background:#040d1c;transition:all .15s;}
.cdot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}

/* ─ FORGE BAR ─ */
#fbar{display:none;margin-bottom:14px;padding:14px 20px;background:#030c1c;border:1px solid #0d2240;border-radius:12px;align-items:center;gap:14px;flex-wrap:wrap;}
#fbar.show{display:flex;}
.fslot{width:60px;height:60px;border-radius:10px;border:2px solid #0d2240;background:#040d1c;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:default;transition:all .25s;flex-shrink:0;}
.fslot-q{font-size:24px;color:#0d2240;}
.fslot-sym{font-size:20px;font-weight:900;font-family:'Orbitron',sans-serif;line-height:1;}
.fslot-name{font-size:7px;margin-top:1px;}
.fslot-num{font-size:7px;align-self:flex-start;padding-left:5px;opacity:.6;}
#sbtn{display:none;padding:11px 20px;background:linear-gradient(135deg,#0091d5,#005f9e);border:none;border-radius:9px;color:#fff;font-size:9px;font-family:'Orbitron',sans-serif;letter-spacing:.15em;cursor:pointer;box-shadow:0 0 22px rgba(0,229,255,.2);}
#sbtn:hover{filter:brightness(1.15);}
#fclr{display:none;background:none;border:1px solid #0d2240;border-radius:7px;color:#1a3a5a;font-size:9px;cursor:pointer;padding:5px 10px;}

/* ─ PERIODIC TABLE ─ */
#tw{overflow-x:auto;padding-bottom:10px;}
#pt{
  display:grid;
  grid-template-columns:repeat(18,minmax(54px,1fr));
  grid-template-rows:repeat(7,58px) 14px repeat(2,58px);
  gap:3px;
  min-width:1000px;
}
.ec{
  border-radius:6px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;padding:2px;cursor:pointer;position:relative;
  transition:transform .12s,box-shadow .12s,border-color .12s;
  border-width:1px;border-style:solid;
}
.ec:hover{transform:scale(1.24);z-index:50;}
.ec.dim{opacity:.09;}
.ec-n{position:absolute;top:2px;left:4px;font-size:7px;line-height:1;opacity:.65;}
.ec-s{font-size:clamp(10px,1vw,15px);font-weight:900;font-family:'Orbitron',sans-serif;line-height:1.1;}
.ec-nm{font-size:clamp(5px,.52vw,7px);margin-top:1px;max-width:96%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;opacity:.75;}
.ph{border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:6px;text-align:center;line-height:1.5;border-width:1px;border-style:dashed;opacity:.4;}
.divrow{grid-column:1/19;display:flex;align-items:center;}
.divrow div{height:1px;width:100%;background:linear-gradient(90deg,transparent,#0d2240 20%,#0d2240 80%,transparent);}
.slbl{display:flex;align-items:center;justify-content:flex-end;padding-right:7px;font-family:'Orbitron',sans-serif;font-size:8px;opacity:.35;}
#ptfoot{margin-top:10px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px;font-size:7.5px;color:#0a1630;}

/* per-category solid visible colors */
.alkali    {background:#1e0810;border-color:rgba(255,77,109,.55);color:#ff4d6d;}
.alkaline  {background:#1e1308;border-color:rgba(255,159,28,.55);color:#ff9f1c;}
.transition{background:#081522;border-color:rgba(77,171,247,.55);color:#4dabf7;}
.post      {background:#08161e;border-color:rgba(116,192,252,.55);color:#74c0fc;}
.metalloid {background:#091a08;border-color:rgba(105,219,124,.55);color:#69db7c;}
.nonmetal  {background:#1e1a00;border-color:rgba(255,224,102,.55);color:#ffe066;}
.halogen   {background:#160b1e;border-color:rgba(218,119,242,.55);color:#da77f2;}
.noble     {background:#1e0812;border-color:rgba(247,131,172,.55);color:#f783ac;}
.lanthanide{background:#120b1e;border-color:rgba(177,151,252,.55);color:#b197fc;}
.actinide  {background:#1e1200;border-color:rgba(255,153,0,.55);color:#ff9900;}

.ec.alkali:hover,.ec.alkali.sel    {background:#2e0a16;border-color:#ff4d6d;box-shadow:0 0 18px rgba(255,77,109,.6);}
.ec.alkaline:hover,.ec.alkaline.sel  {background:#2e1d0a;border-color:#ff9f1c;box-shadow:0 0 18px rgba(255,159,28,.6);}
.ec.transition:hover,.ec.transition.sel{background:#0a2038;border-color:#4dabf7;box-shadow:0 0 18px rgba(77,171,247,.6);}
.ec.post:hover,.ec.post.sel      {background:#0a2030;border-color:#74c0fc;box-shadow:0 0 18px rgba(116,192,252,.6);}
.ec.metalloid:hover,.ec.metalloid.sel {background:#0e2810;border-color:#69db7c;box-shadow:0 0 18px rgba(105,219,124,.6);}
.ec.nonmetal:hover,.ec.nonmetal.sel  {background:#2e2800;border-color:#ffe066;box-shadow:0 0 18px rgba(255,224,102,.6);}
.ec.halogen:hover,.ec.halogen.sel   {background:#28103a;border-color:#da77f2;box-shadow:0 0 18px rgba(218,119,242,.6);}
.ec.noble:hover,.ec.noble.sel     {background:#2e0816;border-color:#f783ac;box-shadow:0 0 18px rgba(247,131,172,.6);}
.ec.lanthanide:hover,.ec.lanthanide.sel{background:#1e1038;border-color:#b197fc;box-shadow:0 0 18px rgba(177,151,252,.6);}
.ec.actinide:hover,.ec.actinide.sel  {background:#2e1a00;border-color:#ff9900;box-shadow:0 0 18px rgba(255,153,0,.6);}

/* ─ QUIZ ─ */
#qpanel{display:none;margin-top:24px;}
#qpanel.show{display:block;}
.qcard{background:#040d1c;border:1px solid #0d2240;border-radius:16px;padding:28px;max-width:560px;margin:0 auto;}
.qlbl{font-size:9px;color:#1a4a7a;letter-spacing:.16em;margin-bottom:10px;font-family:'Orbitron',sans-serif;text-transform:uppercase;}
.qtgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-bottom:20px;}
.qtopt,.dfopt,.rndopt{padding:10px 12px;background:#030a14;border:1px solid #0d2240;border-radius:10px;cursor:pointer;transition:all .15s;}
.qtopt .qt-h,.dfopt .df-h,.rndopt .rnd-h{font-size:10px;font-weight:700;color:#2a5a7a;margin-bottom:3px;}
.qtopt .qt-d,.dfopt .df-d,.rndopt .rnd-d{font-size:8px;color:#1a3a5a;line-height:1.5;}
.opt-on{background:rgba(0,229,255,.07);border-color:rgba(0,229,255,.5);box-shadow:0 0 14px rgba(0,229,255,.1);}
.opt-on .qt-h,.opt-on .df-h,.opt-on .rnd-h{color:#00e5ff;}
.dfflex{display:flex;gap:8px;margin-bottom:16px;}
.startbtn{width:100%;padding:14px;background:linear-gradient(135deg,#0091d5,#005f9e);border:none;border-radius:10px;color:#fff;font-size:11px;font-family:'Orbitron',sans-serif;letter-spacing:.18em;cursor:pointer;box-shadow:0 0 24px rgba(0,229,255,.25);margin-top:8px;}
.startbtn:hover{filter:brightness(1.12);}
#qscore{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;}
.sv{font-size:20px;font-weight:900;font-family:'Orbitron',sans-serif;}
.sk{font-size:8px;color:#1a4a7a;letter-spacing:.1em;margin-top:2px;}
#qpbar{height:5px;width:130px;background:#0a1628;border-radius:4px;overflow:hidden;}
#qpfill{height:100%;background:linear-gradient(90deg,#4dabf7,#00e5ff);transition:width .3s;border-radius:4px;}
#qplbl{font-size:9px;color:#1a4a7a;margin-top:4px;text-align:center;}
#qdisplay{background:#030a14;border-radius:12px;padding:20px;margin-bottom:16px;text-align:center;min-height:115px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;border:1px solid #0d2240;}
.qlabel{font-size:9px;color:#1a4a7a;letter-spacing:.2em;font-family:'Orbitron',sans-serif;}
.qmain{font-size:24px;font-weight:700;font-family:'Orbitron',sans-serif;}
.qsub{font-size:9px;opacity:.4;}
.el-badge-q{border:2px solid;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;}
#qopts{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.qopt{padding:13px 10px;background:#030a14;border:1px solid #0d2240;border-radius:10px;color:#2a5a7a;font-size:11px;cursor:pointer;transition:all .18s;font-family:'Share Tech Mono',monospace;}
.qopt:hover:not([disabled]){background:rgba(0,229,255,.05);border-color:rgba(0,229,255,.3);color:#00e5ff;}
.qopt.correct{background:rgba(105,219,124,.1);border-color:#69db7c;color:#69db7c;}
.qopt.wrong{background:rgba(255,77,109,.1);border-color:#ff4d6d;color:#ff4d6d;}
#qfb{margin-top:12px;text-align:center;font-size:11px;font-family:'Orbitron',sans-serif;letter-spacing:.1em;min-height:20px;}
#qhist{background:#030a14;border:1px solid #0d2240;border-radius:10px;padding:14px;margin-bottom:18px;max-height:240px;overflow-y:auto;}
.hr{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid #0a1628;}
.hb{width:34px;height:34px;border:1px solid;border-radius:7px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.hn{font-size:11px;color:#4a8aaa;}
.hw{font-size:9px;color:#ff4d6d;margin-top:2px;}
.rbtns{display:flex;gap:8px;}
.rbtn{flex:1;padding:12px;background:#030a14;border:1px solid #0d2240;border-radius:10px;color:#2a5a7a;font-size:10px;font-family:'Orbitron',sans-serif;letter-spacing:.1em;cursor:pointer;}
.rbtn:hover{border-color:rgba(0,229,255,.3);color:#00e5ff;}
.rbtn.pri{background:linear-gradient(135deg,#0091d5,#005f9e);border:none;color:#fff;}

/* ─ MODALS ─ */
.ov{position:fixed;inset:0;background:rgba(0,4,12,.93);z-index:500;display:none;align-items:center;justify-content:center;padding:20px;}
.ov.show{display:flex;}
.mbox{background:#040d1c;border-radius:16px;width:100%;max-height:88vh;display:flex;flex-direction:column;box-shadow:0 40px 100px rgba(0,0,0,.95);}
.mhead{padding:20px 24px 16px;flex-shrink:0;border-bottom:1px solid #0d2240;}
.mbody{padding:20px 24px;overflow-y:auto;flex:1;font-size:13px;line-height:1.9;color:#8ab4cc;}
.mcls{background:none;border:none;color:#1a3a5a;cursor:pointer;font-size:20px;line-height:1;}

/* element modal inner */
#em-row{display:flex;justify-content:space-between;align-items:flex-start;}
#em-left{display:flex;gap:18px;align-items:center;}
#em-icon{width:78px;height:78px;border-radius:12px;flex-shrink:0;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;border-width:2px;border-style:solid;}
#em-icon .in{position:absolute;top:4px;left:6px;font-size:8px;opacity:.6;}
#em-icon .is{font-size:28px;font-weight:900;font-family:'Orbitron',sans-serif;line-height:1;}
#em-icon .im{font-size:8px;margin-top:2px;opacity:.5;}
#em-name{font-family:'Orbitron',sans-serif;font-size:20px;font-weight:700;letter-spacing:.06em;}
#em-tags{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap;}
.etag{padding:2px 9px;border:1px solid;border-radius:20px;font-size:9px;text-transform:capitalize;}
.estat{background:#030a14;border:1px solid #0d2240;border-radius:8px;padding:10px 12px;}
.estat-k{font-size:8px;color:#1a4a7a;letter-spacing:.12em;margin-bottom:3px;font-family:'Orbitron',sans-serif;}
.estat-v{font-size:13px;color:#8ab4cc;}
.esec{margin-bottom:16px;}
.esec-t{font-size:9px;letter-spacing:.16em;opacity:.5;margin-bottom:6px;font-family:'Orbitron',sans-serif;text-transform:uppercase;}
.esec-b{font-size:13px;line-height:1.8;color:#8ab4cc;}

/* forge modal inner */
#fm-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
#fm-pair{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.fec{width:62px;height:62px;border:2px solid;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;}
.fec .fn{position:absolute;top:4px;left:5px;font-size:7px;opacity:.55;}
.fec .fs{font-size:20px;font-weight:900;font-family:'Orbitron',sans-serif;line-height:1;}
.fec .fnm{font-size:8px;margin-top:1px;opacity:.75;}
.spinwrap{display:flex;flex-direction:column;align-items:center;gap:16px;padding:36px 0;}
.spinner{position:relative;width:56px;height:56px;}
.sr{position:absolute;inset:0;border:2px solid #040d1c;border-top-color:#4dabf7;border-radius:50%;animation:spin .8s linear infinite;}
.srv{position:absolute;inset:8px;border:2px solid #040d1c;border-top-color:#00e5ff;border-radius:50%;animation:spinr .6s linear infinite;}
.si{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:18px;}
.slabel{font-family:'Orbitron',sans-serif;font-size:9px;letter-spacing:.22em;color:#1a4a7a;}

@keyframes glow{0%,100%{text-shadow:0 0 8px rgba(0,229,255,.3)}50%{text-shadow:0 0 28px rgba(0,229,255,.8),0 0 56px rgba(0,229,255,.3)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinr{to{transform:rotate(-360deg)}}
</style>
</head>
<body>

<header id="hdr">
  <div id="hdr-in">
    <div>
      <div id="logo">⚗ PERIODIC SYNTHESIS</div>
      <div id="logo-sub">118 ELEMENTS · MOLECULAR FORGE · AI EXPLORER · QUIZ MODE</div>
    </div>
    <div id="modebar">
      <button class="mbtn on" data-m="TABLE">🔬 EXPLORE</button>
      <button class="mbtn" data-m="FORGE">⚗ FORGE</button>
      <button class="mbtn" data-m="QUIZ">⚡ QUIZ</button>
    </div>
    <input id="srch" type="text" placeholder="Search name, symbol, number…"/>
  </div>
</header>

<div id="main">
  <div id="legend"></div>
  <div id="fbar">
    <span style="font-family:'Orbitron',sans-serif;font-size:8px;color:#0d2240;letter-spacing:.22em;">SELECT 2 ELEMENTS:</span>
    <div id="fslots" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
      <div class="fslot" id="fs0"><span class="fslot-q">?</span></div>
      <div class="fslot" id="fs1"><span class="fslot-q">?</span></div>
      <button id="sbtn">⚗ SYNTHESIZE</button>
      <button id="fclr">clear</button>
    </div>
  </div>
  <div id="tw"><div id="pt"></div></div>
  <div id="ptfoot">
    <span>118 elements — hover to highlight — click for details</span>
    <span id="mhint">🔬 Click any element for full data</span>
  </div>
  <div id="qpanel"></div>
</div>

<!-- Element Modal -->
<div class="ov" id="eml">
  <div class="mbox" id="em-box" style="max-width:640px;">
    <div class="mhead" id="em-head">
      <div id="em-row">
        <div id="em-left">
          <div id="em-icon"><span class="in" id="ei-n"></span><span class="is" id="ei-s"></span><span class="im" id="ei-m"></span></div>
          <div><div id="em-name"></div><div id="em-tags"></div></div>
        </div>
        <button class="mcls" id="em-cls">✕</button>
      </div>
    </div>
    <div class="mbody" id="em-body"></div>
  </div>
</div>

<!-- Forge Modal -->
<div class="ov" id="fml">
  <div class="mbox" style="max-width:640px;">
    <div class="mhead">
      <div id="fm-top">
        <span style="font-family:'Orbitron',sans-serif;font-size:10px;letter-spacing:.2em;color:#1a4a7a;">⚗ MOLECULAR FORGE</span>
        <button class="mcls" id="fm-cls">✕</button>
      </div>
      <div id="fm-pair"></div>
    </div>
    <div class="mbody" id="fm-body"></div>
  </div>
</div>

// AI call (forge only — no loading screen on failure)
// ════════════════════════════════════════════
function callAI(prompt, cb) {
  var xhr = new XMLHttpRequest();
  xhr.open('POST','https://api.anthropic.com/v1/messages');
  xhr.setRequestHeader('Content-Type','application/json');
  xhr.timeout = 18000;
  xhr.ontimeout = function(){ cb(null); };
  xhr.onerror = function(){ cb(null); };
  xhr.onload = function(){
    try {
      var d = JSON.parse(xhr.responseText);
      var txt = (d.content||[]).map(function(b){return b.text||'';}).join('');
      cb(txt||null);
    } catch(e){ cb(null); }
  };
  xhr.send(JSON.stringify({
    model:'claude-sonnet-4-20250514', max_tokens:700,
    messages:[{role:'user',content:prompt}]
  }));
}

function buildLegend() {
  var lg = document.getElementById('legend');
  lg.innerHTML = '';
  Object.keys(CATS).forEach(function(cat){
    var lbl = CATS[cat];
    var c = CAT_C[cat];
    var on = catFilt === cat;
    var p = document.createElement('div');
    p.className = 'cpill';
    p.style.color = on ? c : 'rgba(200,220,240,0.4)';
    p.style.borderColor = on ? c : '#0d2240';
    if(on) p.style.boxShadow = '0 0 10px ' + c + '44';
    p.innerHTML = '<span class="cdot" style="background:' + c + ';box-shadow:0 0 5px ' + c + '"></span>' + lbl;
    p.addEventListener('click', function(){
      catFilt = catFilt === cat ? null : cat;
      buildLegend();
      applyFilter();
    });
    lg.appendChild(p);
  });
  var rst = document.createElement('div');
  rst.className = 'cpill';
  rst.textContent = '✕ reset';
  rst.style.display = (catFilt || searchStr) ? 'flex' : 'none';
  rst.addEventListener('click', function(){
    catFilt = null; searchStr = '';
    document.getElementById('srch').value = '';
    buildLegend(); applyFilter();
  });
  lg.appendChild(rst);
}

function applyFilter() {
  var q = searchStr.toLowerCase().trim();
  ELS.forEach(function(e){
    var cell = document.getElementById('ec' + e.n);
    if(!cell) return;
    var dim = false;
    if(q && !(e.nm.toLowerCase().indexOf(q) >= 0 || e.s.toLowerCase().indexOf(q) >= 0 || String(e.n).indexOf(q) >= 0)) dim = true;
    if(catFilt && e.cat !== catFilt) dim = true;
    if(dim) cell.classList.add('dim'); else cell.classList.remove('dim');
  });
}

function onCellClick(e) {
  if(curMode === 'FORGE') { onFCell(e); return; }
  if(curMode !== 'TABLE') return;
  openElModal(e);
}

function fmt(v, unit) {
  if(v === null || v === undefined) return '—';
  return v + (unit || '');
}

function openElModal(e) {
  var c = CAT_C[e.cat];
  var box = document.getElementById('em-box');
  box.style.border = '1px solid ' + c + '55';
  box.style.boxShadow = '0 0 60px rgba(0,0,0,.5), 0 40px 100px rgba(0,0,0,.95)';

  var head = document.getElementById('em-head');
  head.style.borderBottomColor = c + '33';

  var icon = document.getElementById('em-icon');
  icon.style.border = '2px solid ' + c;
  icon.style.background = c + '1a';
  icon.style.boxShadow = '0 0 30px ' + c + '55';

  document.getElementById('ei-n').textContent = e.n;
  var eis = document.getElementById('ei-s');
  eis.textContent = e.s; eis.style.color = c;
  document.getElementById('ei-m').textContent = e.mass.toFixed ? e.mass.toFixed(3) : e.mass;

  var nm = document.getElementById('em-name');
  nm.textContent = e.nm; nm.style.color = c;

  var tags = document.getElementById('em-tags');
  tags.innerHTML = '';
  [CATS[e.cat], 'Period ' + e.per, 'Group ' + e.grp, e.phase].forEach(function(t, i){
    var tag = document.createElement('span');
    tag.className = 'etag';
    tag.textContent = t;
    tag.style.borderColor = i === 0 ? c + '55' : '#0d2240';
    tag.style.background  = i === 0 ? c + '18' : '#030a14';
    tag.style.color       = i === 0 ? c        : '#2a5278';
    tags.appendChild(tag);
  });

  var d = ED[e.n] || {};

  // stat grid

  grid.style.cssText = 'display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;';
  [['MELTING POINT', fmt(d.mp, '°C')], ['BOILING POINT', fmt(d.bp, '°C')],
   ['ATOMIC MASS', e.mass + ' u'], ['PHASE AT STP', e.phase]].forEach(function(pair){
    var st = document.createElement('div');
    st.className = 'estat';
    st.innerHTML = '<div class="estat-k">' + pair[0] + '</div><div class="estat-v">' + pair[1] + '</div>';

  });

  body.innerHTML = '';

    addSection(body, 'ELECTRON CONFIGURATION', '<span style="font-family:Orbitron,sans-serif;font-size:14px;color:' + c + '">' + d.ec + '</span>', c);
  }
  if(d.disc) addSection(body, 'DISCOVERY', d.disc, c);

  var s = document.createElement('div');
  s.className = 'esec';
  s.innerHTML = '<div class="esec-t" style="color:' + c + '88">' + title + '</div><div class="esec-b">' + content + '</div>';
  parent.appendChild(s);
}

function closeElModal() { document.getElementById('eml').classList.remove('show'); }

// ════════════════════════════════════════════
// FORGE
// ════════════════════════════════════════════
function onFCell(e) {
  var idx = -1;
  for(var i=0;i<fpair.length;i++) if(fpair[i].n === e.n) { idx = i; break; }
  if(idx >= 0) fpair.splice(idx,1);
  else { if(fpair.length >= 2) fpair.shift(); fpair.push(e); }
  updForgeSlots();
  updForgeHL();
}

function updForgeSlots() {
  [0,1].forEach(function(i){
    var slot = document.getElementById('fs' + i);
    var e = fpair[i];
    if(e) {
      var c = CAT_C[e.cat];
      slot.style.border = '2px solid ' + c;
      slot.style.background = c + '1a';
      slot.style.boxShadow = '0 0 18px ' + c + '66';
      slot.style.cursor = 'pointer';
      slot.innerHTML =
        '<span class="fslot-num" style="color:' + c + '88;align-self:flex-start;padding-left:5px;">' + e.n + '</span>' +
        '<span class="fslot-sym" style="color:' + c + '">' + e.s + '</span>' +
        '<span class="fslot-name" style="color:' + c + 'cc">' + e.nm + '</span>';
      (function(el){ slot.onclick = function(){ onFCell(el); }; })(e);
    } else {
      slot.style.border = '2px solid #0d2240';
      slot.style.background = '#040d1c';
      slot.style.boxShadow = 'none';
      slot.style.cursor = 'default';
      slot.innerHTML = '<span class="fslot-q">?</span>';
      slot.onclick = null;
    }
  });
  document.getElementById('sbtn').style.display = fpair.length === 2 ? 'inline-block' : 'none';
  document.getElementById('fclr').style.display = fpair.length > 0 ? 'inline-block' : 'none';
}

function updForgeHL() {
  ELS.forEach(function(e){
    var cell = document.getElementById('ec' + e.n);
    if(!cell) return;
    var sel = false;
    for(var i=0;i<fpair.length;i++) if(fpair[i].n===e.n){sel=true;break;}
    if(sel) cell.classList.add('sel'); else cell.classList.remove('sel');
  });
}

function clearForge(silent) {
  fpair = [];
  updForgeSlots();
  updForgeHL();
}

function openForge() {
  if(fpair.length < 2) return;
  var a = fpair[0], b = fpair[1];
  var ca = CAT_C[a.cat], cb = CAT_C[b.cat];

  var pair = document.getElementById('fm-pair');
  pair.innerHTML = '';

  function makeFec(el, c) {
    var d = document.createElement('div');
    d.className = 'fec';
    d.style.cssText = 'border-color:' + c + ';background:' + c + '1a;box-shadow:0 0 22px ' + c + '44;';
    d.innerHTML =
      '<span class="fn" style="color:' + c + '88">' + el.n + '</span>' +
      '<span class="fs" style="color:' + c + '">' + el.s + '</span>' +
      '<span class="fnm" style="color:' + c + 'cc">' + el.nm + '</span>';
    return d;
  }
  pair.appendChild(makeFec(a, ca));
  var plus = document.createElement('span');
  plus.style.cssText = 'font-size:22px;color:#1a4a7a;margin:0 6px;';
  plus.textContent = '+';
  pair.appendChild(plus);
  pair.appendChild(makeFec(b, cb));
  var arr = document.createElement('span');
  arr.style.cssText = 'font-size:22px;color:rgba(0,229,255,.5);margin:0 8px;';
  arr.textContent = '→';
  pair.appendChild(arr);
  var lbl = document.createElement('span');
  lbl.id = 'fm-synth-lbl';
  lbl.style.cssText = 'font-family:Orbitron,sans-serif;font-size:10px;color:rgba(0,229,255,.35);letter-spacing:.12em;';
  lbl.textContent = 'SYNTHESIS';
  pair.appendChild(lbl);

  var body = document.getElementById('fm-body');
  body.innerHTML =
    '<div class="spinwrap">' +
    '<div class="spinner"><div class="sr"></div><div class="srv"></div><div class="si">⚗️</div></div>' +
    '<span class="slabel">ANALYZING CHEMISTRY…</span>' +
    '</div>';

  document.getElementById('fml').classList.add('show');

  var prompt = 'Describe the chemistry between ' + a.nm + ' (' + a.s + ') and ' + b.nm + ' (' + b.s + ').\n' +
    'Use these plain-text headers:\n\n' +
    'REACTION\nBalanced equations where applicable.\n\n' +
    'CONDITIONS\nTemperature, pressure, catalysts.\n\n' +
    'PRODUCTS\nMain compounds formed with formulas.\n\n' +
    'APPLICATIONS\nReal-world uses.\n\n' +
    'REMARKABLE FACT\nOne extraordinary aspect.\n\nAbout 250 words.';

  callAI(prompt, function(txt){
    document.getElementById('fm-synth-lbl').style.color = '#00e5ff';
    if(txt) {
      body.style.whiteSpace = 'pre-wrap';
      body.textContent = txt;
    } else {
      body.innerHTML =
        '<div style="color:#4a8aaa;font-size:11px;margin-bottom:14px;padding:8px 12px;background:#030a14;border:1px solid #0d2240;border-radius:8px;font-family:Orbitron,sans-serif;letter-spacing:.1em">' +
        '⚠ AI UNAVAILABLE — showing element data</div>' +
        '<b style="color:' + ca + '">' + a.nm + ':</b> ' + (ED[a.n] && ED[a.n].fact || '') + '<br><br>' +
        '<b style="color:' + cb + '">' + b.nm + ':</b> ' + (ED[b.n] && ED[b.n].fact || '');
    }
  });
}

function closeForge() { document.getElementById('fml').classList.remove('show'); }

// ════════════════════════════════════════════
// QUIZ — 6 types, configurable round length
// ════════════════════════════════════════════
var QTYPES = [
  {id:'symbol', h:'Name → Symbol',  d:'See the name, pick the symbol'},
  {id:'name',   h:'Symbol → Name',  d:'See the symbol, choose the name'},
  {id:'number', h:'Atomic Number',  d:'See the element, pick its number'},
  {id:'cat',    h:'Category',       d:'Identify which category it belongs to'},
  {id:'period', h:'Which Period?',  d:'Which period does the element belong to?'},
  {id:'oddone', h:'Odd One Out',    d:'Which symbol does NOT belong to the category shown?'}
];
var QROUNDS = [10, 20, 30];
var QS = {qtype:'symbol', diff:'medium', round:20, score:0, streak:0, best:0, rq:0, hist:[], q:null, chosen:false, tmr:null};

function qpool() {
  if(QS.diff === 'easy') return ELS.filter(function(e){ return e.n <= 36; });
  if(QS.diff === 'medium') return ELS.filter(function(e){ return e.n <= 86; });
  return ELS;
}

function shuf(a) { return a.slice().sort(function(){ return Math.random() - 0.5; }); }

function renderQConfig() {
  var panel = document.getElementById('qpanel');
  panel.innerHTML = '';
  var card = document.createElement('div');
  card.className = 'qcard';

  // header
  var hrow = document.createElement('div');
  hrow.style.cssText = 'display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;';
  var h3 = document.createElement('h3');
  h3.style.cssText = 'font-family:Orbitron,sans-serif;font-size:13px;color:#00e5ff;letter-spacing:.16em;';
  h3.textContent = '⚡ QUIZ CONFIGURATION';
  var xcls = document.createElement('button');
  xcls.className = 'mcls';
  xcls.textContent = '✕';
  xcls.addEventListener('click', function(){ setMode('TABLE'); });
  hrow.appendChild(h3); hrow.appendChild(xcls);
  card.appendChild(hrow);

  // question types
  var qlbl1 = document.createElement('p'); qlbl1.className = 'qlbl'; qlbl1.textContent = 'QUESTION TYPE'; card.appendChild(qlbl1);
  var qtg = document.createElement('div'); qtg.className = 'qtgrid'; card.appendChild(qtg);
  QTYPES.forEach(function(qt){
    var opt = document.createElement('div');
    opt.className = 'qtopt' + (QS.qtype === qt.id ? ' opt-on' : '');
    opt.innerHTML = '<div class="qt-h">' + qt.h + '</div><div class="qt-d">' + qt.d + '</div>';
    opt.addEventListener('click', function(){ QS.qtype = qt.id; renderQConfig(); });
    qtg.appendChild(opt);
  });

  // difficulty
  var qlbl2 = document.createElement('p'); qlbl2.className = 'qlbl'; qlbl2.textContent = 'DIFFICULTY'; card.appendChild(qlbl2);
  var dff = document.createElement('div'); dff.className = 'dfflex'; card.appendChild(dff);
  [{id:'easy',c:'#69db7c',desc:'1–36'},{id:'medium',c:'#ffe066',desc:'1–86'},{id:'hard',c:'#ff4d6d',desc:'All 118'}].forEach(function(dv){
    var opt = document.createElement('div');
    opt.className = 'dfopt' + (QS.diff === dv.id ? ' opt-on' : '');
    if(QS.diff === dv.id) opt.style.cssText = 'border-color:' + dv.c + ';box-shadow:0 0 14px ' + dv.c + '22;';
    opt.innerHTML = '<div class="df-h" style="color:' + (QS.diff===dv.id?dv.c:'#2a5a7a') + '">' + dv.id.toUpperCase() + '</div><div class="df-d">Elements ' + dv.desc + '</div>';
    opt.addEventListener('click', function(){ QS.diff = dv.id; renderQConfig(); });
    dff.appendChild(opt);
  });

  // round length
  var qlbl3 = document.createElement('p'); qlbl3.className = 'qlbl'; qlbl3.textContent = 'ROUND LENGTH'; card.appendChild(qlbl3);
  var rdf = document.createElement('div'); rdf.className = 'dfflex'; rdf.style.marginBottom='24px'; card.appendChild(rdf);
  QROUNDS.forEach(function(r){
    var opt = document.createElement('div');
    opt.className = 'rndopt' + (QS.round === r ? ' opt-on' : '');
    opt.innerHTML = '<div class="rnd-h" style="color:' + (QS.round===r?'#00e5ff':'#2a5a7a') + '">' + r + '</div><div class="rnd-d">questions</div>';
    opt.addEventListener('click', function(){ QS.round = r; renderQConfig(); });
    rdf.appendChild(opt);
  });

  var startbtn = document.createElement('button');
  startbtn.className = 'startbtn';
  startbtn.textContent = '▶ START — ' + QS.round + ' QUESTIONS';
  startbtn.addEventListener('click', startQuiz);
  card.appendChild(startbtn);

  panel.appendChild(card);
}

function startQuiz() {
  QS.score = 0; QS.streak = 0; QS.best = 0; QS.rq = 0; QS.hist = []; QS.q = null; QS.chosen = false;
  clearTimeout(QS.tmr);
  genQuestion();
}

function genQuestion() {
  var pool = shuf(qpool());
  var t = pool[0];
  var correct = '', options = [];
  var qt = QS.qtype;

  if(qt === 'symbol') {
    correct = t.s;
    options = shuf([t.s, pool[1].s, pool[2].s]);
  } else if(qt === 'name') {
    correct = t.nm;
    options = shuf([t.nm, pool[1].nm, pool[2].nm]);
  } else if(qt === 'number') {
    correct = String(t.n);
    var cands = [];
    [-3,-2,-1,1,2,3].forEach(function(d){ var v=t.n+d; if(v>0&&v<=118) cands.push(String(v)); });
    options = shuf([correct].concat(shuf(cands).slice(0,2)));
  } else if(qt === 'cat') {
    correct = CATS[t.cat];
    var otherCats = Object.values(CATS).filter(function(c){ return c !== correct; });
    options = shuf([correct].concat(shuf(otherCats).slice(0,2)));
  } else if(qt === 'period') {
    correct = String(t.per);
    var otherPers = [1,2,3,4,5,6,7].filter(function(p){ return p !== t.per; });
    options = shuf([correct].concat(shuf(otherPers).slice(0,2).map(String)));
  } else if(qt === 'oddone') {
    var sameCat = pool.filter(function(e){ return e.cat === t.cat && e.n !== t.n; });
    var diffCat = pool.filter(function(e){ return e.cat !== t.cat; });
    if(sameCat.length < 2 || diffCat.length < 1) { genQuestion(); return; }
    var odd = diffCat[0];
    correct = odd.s;
    options = shuf([odd.s, sameCat[0].s, sameCat[1].s]);
    QS.q = {el:t, correct:correct, options:options, oddone:true, targetCat:t.cat, oddEl:odd};
    QS.chosen = false;
    renderQPlay();
    return;
  }

  QS.q = {el:t, correct:correct, options:options};
  QS.chosen = false;
  renderQPlay();
}

function renderQPlay() {
  var panel = document.getElementById('qpanel');
  panel.innerHTML = '';
  var q = QS.q;
  var e = q.el;
  var c = CAT_C[e.cat];
  var card = document.createElement('div');
  card.className = 'qcard';
  card.style.cssText = 'border-color:' + c + '33;';

  // scorebar
  var sb = document.createElement('div');
  sb.id = 'qscore';

  var scoreDiv = document.createElement('div');
  scoreDiv.style.display = 'flex'; scoreDiv.style.gap = '16px';
  [['#00e5ff', QS.score, 'SCORE'],['#ffe066', QS.streak, 'STREAK']].forEach(function(x){
    var d = document.createElement('div');
    d.innerHTML = '<div class="sv" style="color:' + x[0] + '">' + x[1] + '</div><div class="sk">' + x[2] + '</div>';
    scoreDiv.appendChild(d);
  });

  var progDiv = document.createElement('div');
  progDiv.style.textAlign = 'center';
  var pbar = document.createElement('div'); pbar.id = 'qpbar';
  var pfill = document.createElement('div'); pfill.id = 'qpfill';
  pfill.style.width = ((QS.rq / QS.round) * 100) + '%';
  pbar.appendChild(pfill);
  var plbl = document.createElement('div'); plbl.id = 'qplbl';
  plbl.textContent = QS.rq + ' / ' + QS.round;
  progDiv.appendChild(pbar); progDiv.appendChild(plbl);

  var xcls = document.createElement('button');
  xcls.className = 'mcls'; xcls.textContent = '✕';
  xcls.addEventListener('click', renderQConfig);

  sb.appendChild(scoreDiv); sb.appendChild(progDiv); sb.appendChild(xcls);
  card.appendChild(sb);

  // question display
  var qd = document.createElement('div');
  qd.id = 'qdisplay';
  qd.style.borderColor = c + '33';

  var ql = document.createElement('span'); ql.className = 'qlabel';
  var qt = QS.qtype;

  if(qt === 'symbol') {
    ql.textContent = 'WHAT IS THE SYMBOL FOR…';
    var qm = document.createElement('span'); qm.className = 'qmain'; qm.style.color = c; qm.textContent = e.nm;
    var qs = document.createElement('span'); qs.className = 'qsub'; qs.textContent = '#' + e.n + ' · ' + CATS[e.cat];
    qd.appendChild(ql); qd.appendChild(qm); qd.appendChild(qs);
  } else if(qt === 'name') {
    ql.textContent = 'WHICH ELEMENT HAS THIS SYMBOL?';
    var badge = makeBadge(e, c, 72, 26);
    qd.appendChild(ql); qd.appendChild(badge);
  } else if(qt === 'number') {
    ql.textContent = 'WHAT IS THE ATOMIC NUMBER OF…';
    var row2 = document.createElement('div'); row2.style.cssText = 'display:flex;align-items:center;gap:12px;';
    row2.appendChild(makeBadge(e, c, 58, 20));
    var qm2 = document.createElement('span'); qm2.className = 'qmain'; qm2.style.cssText = 'color:' + c + ';font-size:20px;'; qm2.textContent = e.nm;
    row2.appendChild(qm2);
    qd.appendChild(ql); qd.appendChild(row2);
  } else if(qt === 'cat') {
    ql.textContent = 'WHICH CATEGORY IS THIS ELEMENT?';
    qd.appendChild(ql); qd.appendChild(makeBadge(e, c, 64, 20));
  } else if(qt === 'period') {
    ql.textContent = 'WHICH PERIOD IS THIS ELEMENT IN?';
    qd.appendChild(ql); qd.appendChild(makeBadge(e, c, 64, 20));
  } else if(qt === 'oddone') {
    ql.textContent = 'WHICH SYMBOL IS NOT A ' + CATS[q.targetCat].toUpperCase() + '?';
    var qs2 = document.createElement('span'); qs2.className = 'qsub'; qs2.style.fontSize='10px'; qs2.textContent = 'Find the element that does not belong';
    qd.appendChild(ql); qd.appendChild(qs2);
  }
  card.appendChild(qd);

  // options — use data-idx, no inline string
  var opts = document.createElement('div');
  opts.id = 'qopts';
  q.options.forEach(function(opt, idx){
    var btn = document.createElement('button');
    btn.className = 'qopt';
    btn.textContent = opt;
    btn.dataset.idx = idx;
    btn.addEventListener('click', function(){ answerQ(idx); });
    opts.appendChild(btn);
  });
  card.appendChild(opts);

  var fb = document.createElement('div'); fb.id = 'qfb'; card.appendChild(fb);
  panel.appendChild(card);
}

function makeBadge(e, c, size, symSize) {
  var b = document.createElement('div');
  b.className = 'el-badge-q';
  b.style.cssText = 'width:' + size + 'px;height:' + size + 'px;border-color:' + c + ';background:' + c + '1a;box-shadow:0 0 24px ' + c + '55;';
  var num = document.createElement('span');
  num.style.cssText = 'position:absolute;top:4px;left:5px;font-size:7px;color:' + c + '77;';
  num.textContent = e.n;
  var sym = document.createElement('span');
  sym.style.cssText = 'font-size:' + symSize + 'px;font-weight:900;font-family:Orbitron,sans-serif;color:' + c + ';line-height:1;';
  sym.textContent = e.s;
  b.appendChild(num); b.appendChild(sym);
  if(size >= 64) {
    var nm = document.createElement('span');
    nm.style.cssText = 'font-size:8px;color:' + c + 'cc;margin-top:1px;';
    nm.textContent = e.nm;
    b.appendChild(nm);
  }
  return b;
}

function answerQ(idx) {
  if(QS.chosen) return;
  QS.chosen = true;
  var q = QS.q;
  var chosen = q.options[idx];
  var ok = chosen === q.correct;

  var btns = document.querySelectorAll('.qopt');
  btns.forEach(function(btn){
    btn.disabled = true;
    var bi = parseInt(btn.dataset.idx);
    var bopt = q.options[bi];
    if(bopt === q.correct) {
      btn.classList.add('correct');
      btn.textContent = '✓ ' + bopt;
    } else if(bi === idx && !ok) {
      btn.classList.add('wrong');
      btn.textContent = '✕ ' + bopt;
    }
  });

  var ns = ok ? QS.streak + 1 : 0;
  QS.streak = ns;
  if(ns > QS.best) QS.best = ns;
  if(ok) QS.score++;
  QS.hist.push({el:q.el, ok:ok, chosen:chosen, correct:q.correct});

  var fb = document.getElementById('qfb');
  fb.textContent = ok ? '⚡ CORRECT!' : '✕ INCORRECT — ' + q.correct;
  fb.style.color = ok ? '#69db7c' : '#ff4d6d';

  var nrq = QS.rq + 1;
  QS.rq = nrq;
  if(nrq >= QS.round) { QS.tmr = setTimeout(renderQResult, 1400); return; }
  QS.tmr = setTimeout(genQuestion, 1500);
}

function renderQResult() {
  var panel = document.getElementById('qpanel');
  panel.innerHTML = '';
  var card = document.createElement('div');
  card.className = 'qcard';
  card.style.textAlign = 'center';

  var pct = QS.score / QS.round;
  var emoji = pct >= 0.8 ? '🏆' : pct >= 0.5 ? '⭐' : '🔬';
  var title = pct >= 0.8 ? 'EXCELLENT' : pct >= 0.5 ? 'GOOD WORK' : 'KEEP STUDYING';

  card.innerHTML =
    '<div style="font-size:44px;margin-bottom:10px">' + emoji + '</div>' +
    '<div style="font-family:Orbitron,sans-serif;font-size:17px;color:#00e5ff;letter-spacing:.1em;margin-bottom:6px">' + title + '</div>' +
    '<div style="color:#1a4a7a;font-size:12px;margin-bottom:22px">' + QS.score + ' / ' + QS.round + ' correct &nbsp;·&nbsp; Best streak ' + QS.best + '</div>';

  var hist = document.createElement('div');
  hist.id = 'qhist';
  QS.hist.forEach(function(h){
    var c = CAT_C[h.el.cat];
    var row = document.createElement('div');
    row.className = 'hr';
    row.innerHTML =
      '<span style="font-size:14px">' + (h.ok ? '✅' : '❌') + '</span>' +
      '<div class="hb" style="border-color:' + c + ';background:' + c + '1a"><span style="font-size:10px;font-weight:900;font-family:Orbitron,sans-serif;color:' + c + '">' + h.el.s + '</span></div>' +
      '<div><div class="hn">' + h.el.nm + '</div>' + (!h.ok ? '<div class="hw">You: ' + h.chosen + ' &nbsp;·&nbsp; Correct: ' + h.correct + '</div>' : '') + '</div>';
    hist.appendChild(row);
  });
  card.appendChild(hist);

  var rbtns = document.createElement('div');
  rbtns.className = 'rbtns';

  var r1 = document.createElement('button'); r1.className='rbtn pri'; r1.textContent='PLAY AGAIN'; r1.addEventListener('click', startQuiz);
  var r2 = document.createElement('button'); r2.className='rbtn'; r2.textContent='CONFIGURE'; r2.addEventListener('click', renderQConfig);
  var r3 = document.createElement('button'); r3.className='rbtn'; r3.style.flex='0'; r3.style.padding='12px 14px'; r3.textContent='✕'; r3.addEventListener('click', function(){ setMode('TABLE'); });
  rbtns.appendChild(r1); rbtns.appendChild(r2); rbtns.appendChild(r3);
  card.appendChild(rbtns);
  panel.appendChild(card);
}
